<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odyssey | Sua jornada pelos biomas da Terra</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <canvas id="starfield"></canvas>

  <header class="top-brand">
    <span>ODYSSEY</span>
  </header>

  <main class="stage">

    <div class="wheel-wrap" id="wheelWrap">
      <div class="orbit-track"></div>
      <div class="orbit" id="orbit"><!-- nós injetados via JS --></div>

      <div class="core">
        <span class="core-ring ring-1"></span>
        <span class="core-ring ring-2"></span>
        <span class="core-text">ODYSSEY</span>
      </div>
    </div>

    <section class="info-panel" id="infoPanel">
      <span class="info-index" id="infoIndex">00</span>
      <h1 id="infoTitle">Escolha seu destino</h1>
      <p id="infoDesc">Gire ou clique em um módulo da órbita para revelar cada bioma do planeta.</p>
    </section>

    <!-- Landing do bioma: conteúdo direto na página.
         Para o oceano, a estrutura é substituída por "zonas de
         profundidade" em blocos de cor sólida, replicando o
         design de referência. Amazônia/Tundra mantêm o layout padrão. -->
    <section
      class="biome-landing"
      id="biomeLanding"
      aria-hidden="true"
    >
      <div class="landing-clip">
        <div class="landing-content" id="landingContent">

          <div class="landing-bg" id="landingBg" aria-hidden="true">
            <div class="landing-divider" id="landingDivider"></div>
            <span class="landing-blob blob-1"></span>
            <span class="landing-blob blob-2"></span>
            <span class="landing-blob blob-3"></span>
            <span class="landing-blob blob-4"></span>
            <span class="landing-blob blob-5"></span>
          </div>

          <button class="landing-close" id="landingClose" aria-label="Fechar detalhes do bioma">✕</button>

          <!-- Layout padrão (usado por Amazônia e Tundra) -->
          <div class="landing-inner" id="landingInner">
            <div class="landing-hero">
              <span class="landing-icon" id="landingIcon" aria-hidden="true"></span>
              <h2 class="landing-title" id="landingTitle"></h2>
              <p class="landing-tagline" id="landingTagline"></p>
            </div>

            <div class="landing-stats" id="landingStats"><!-- injetado via JS --></div>
            <div class="landing-body" id="landingBody"><!-- injetado via JS --></div>
            <p class="landing-fact" id="landingFact"></p>
          </div>

          <!-- Layout de zonas de profundidade (usado pelo Oceano) -->
          <div class="ocean-zones" id="oceanZones" hidden></div>

          <button class="landing-back" id="landingBack">← Voltar à órbita</button>
        </div>
      </div>
    </section>

  </main>

  <script src="javascript/main.js" defer></script>
</body>
</html>
